<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventiquattresimo Selfwork Javascript</title>
</head>
<body>
    <script>
        function fizzBuzz(n){
            for(let i=1;i<=n;i++){
                switch(true){
                    case i%15==0:
                        console.log("fizzBuzz");
                        break;
                    case i%5==0:
                        console.log("Buzz");
                        break;
                    case i%3==0:
                        console.log("Fizz");
                        break;
                    default:
                        console.log(i);
                        break;
                }
            }
        }
        fizzBuzz(15);
    </script>
</body>
</html>
